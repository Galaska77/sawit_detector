name: Flutter CI & Build APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze_test_and_web:
    name: Analyze, Test & Build Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter (3.41.x)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.41.x'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: |
          set +e
          flutter analyze --no-fatal-infos > analyze.log 2>&1
          EXIT_CODE=$?
          cat analyze.log
          if [ $EXIT_CODE -ne 0 ]; then
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done < analyze.log
          fi
          exit $EXIT_CODE

      - name: Run unit & widget tests
        run: |
          set +e
          flutter test -r expanded > test.log 2>&1
          EXIT_CODE=$?
          cat test.log
          if [ $EXIT_CODE -ne 0 ]; then
            grep -A 2 -E "(The following assertion was thrown:|The following message was thrown:|\[E\])" test.log | grep -v -E "^(--|The following assertion was thrown:|The following message was thrown:)$" | head -n 10 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit $EXIT_CODE

      - name: Build Web App
        run: |
          set +e
          flutter build web --release > web_build.log 2>&1
          EXIT_CODE=$?
          cat web_build.log
          if [ $EXIT_CODE -ne 0 ]; then
            tail -n 15 web_build.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
          fi
          exit $EXIT_CODE

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: sawit-detector-web
          path: build/web
          retention-days: 14

      - name: Publish Web build to web-build branch
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          cd build/web
          touch .nojekyll
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b web-build
          git add -A
          git commit -m "Build Flutter Web untuk ${GITHUB_SHA}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" web-build:web-build

  build_apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter (3.41.x)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.41.x'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: |
          set +e
          flutter build apk --release > apk_build.log 2>&1
          EXIT_CODE=$?
          cat apk_build.log
          if [ $EXIT_CODE -ne 0 ]; then
            tail -n 20 apk_build.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
          fi
          exit $EXIT_CODE

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sawit-detector-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
